<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="shot-009-hormuz-share-a2"><rect width="640" height="360" fill="#1a1410"/><text x="40" y="80" fill="#f0c27a" font-family="ui-monospace, monospace" font-size="16">shot-009-hormuz-share-a2</text><text x="40" y="160" fill="#f3e6d4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">CUTAWAY, Tanker in an open Hormuz lane, land close on both sides. The water is quiet.</text></svg>

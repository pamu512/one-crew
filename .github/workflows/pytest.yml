# Unit suite only. No secrets. Live Parallel / Vertex / Imagen stay unconfigured.
# Local equivalent: pip install -r backend/requirements.txt && PYTHONPATH=backend pytest backend/tests -q
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: backend
        run: pytest backend/tests -q
